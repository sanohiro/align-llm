name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Pinned Align compiler and fixed evaluation
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install LLVM and native libraries
        shell: bash
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22 libclang-rt-22-dev \
            libssl-dev zlib1g-dev libzstd-dev bubblewrap make perl
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Check out pinned Align revision
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          mkdir align
          git -C align init
          git -C align remote add origin https://github.com/sanohiro/align.git
          git -C align fetch --depth 1 origin "$revision"
          git -C align checkout --detach FETCH_HEAD

      - name: Run project gate
        env:
          ALIGN_REPO: ${{ github.workspace }}/align
        run: make ci
