name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Pinned Align compiler and supported checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Classify verification scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          full=false
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            full=true
          else
            while IFS= read -r path; do
              case "$path" in
                .align-revision|Makefile|build.rs|Cargo.*|.github/workflows/*|src/*|scripts/*|tests/*|examples/*|bench/*|*.align|*.py|*.sh)
                  full=true
                  break
                  ;;
                eval/*)
                  if [[ "$path" != *.md ]]; then
                    full=true
                    break
                  fi
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [[ "$full" == "true" ]]; then
            echo "Verification scope: full supported checks"
          else
            echo "Verification scope: documentation and static checks only"
          fi

      - name: Run documentation and static checks
        if: steps.scope.outputs.full != 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- .
          while IFS= read -r path; do
            if [[ ! -f "$path" ]]; then
              continue
            fi
            case "$path" in
              *.md)
                fences="$(awk '/^```/ { count++ } END { print count + 0 }' "$path")"
                if (( fences % 2 != 0 )); then
                  echo "Unbalanced Markdown fences: $path" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

      - name: Install Rust
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Install LLVM and native libraries
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev clang-22 libclang-rt-22-dev \
            libssl-dev zlib1g-dev libzstd-dev make perl
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG=/usr/lib/llvm-22/bin/llvm-config" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Check out pinned Align revision
        if: steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          mkdir align
          git -C align init
          git -C align remote add origin https://github.com/sanohiro/align.git
          git -C align fetch --depth 1 origin "$revision"
          git -C align checkout --detach FETCH_HEAD

      - name: Run supported project checks
        if: steps.scope.outputs.full == 'true'
        env:
          ALIGN_REPO: ${{ github.workspace }}/align
        run: |
          # coding-v1 requires nested user namespaces, which GitHub-hosted runners deny.
          # Keep that gate in make ci for local or capable self-hosted runners.
          # baseline-check remains in the capable gate with coding-v1.
          make align-build
          test -x "$ALIGN_REPO/target/release/alignc"
          python3 scripts/check-gate-topology --self-test
          make -j8 ALIGNC="$ALIGN_REPO/target/release/alignc" hosted-checks
