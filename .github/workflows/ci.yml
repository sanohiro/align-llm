name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.96.0
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Pinned Align compiler and supported checks
    runs-on: ubuntu-24.04
    env:
      ALIGN_APT_PACKAGES: >-
        llvm-22-dev clang-22 libclang-rt-22-dev lld-22
        libssl-dev zlib1g-dev libzstd-dev make perl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reuse exact merged pull request checks
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/select-ci-reuse
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --api-url "$GITHUB_API_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Report reused pull request checks
        if: steps.reuse.outputs.reused == 'true'
        env:
          SOURCE_HEAD: ${{ steps.reuse.outputs.source_head }}
          PULL_REQUEST: ${{ steps.reuse.outputs.pull_request }}
          WORKFLOW_RUN: ${{ steps.reuse.outputs.workflow_run }}
        run: >-
          echo "Reused pull request #$PULL_REQUEST workflow run $WORKFLOW_RUN
          for exact head $SOURCE_HEAD."

      - name: Classify verification scope
        id: scope
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          head_sha="$HEAD_SHA"
          select_all=false
          case "$EVENT_NAME" in
            pull_request)
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              head_sha="$GITHUB_SHA"
              select_all=true
              ;;
          esac
          if [[ -z "$head_sha" || "$head_sha" =~ ^0+$ ]]; then
            echo "Cannot resolve the event head" >&2
            exit 1
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            select_all=true
          fi
          if [[ "$select_all" == "true" ]]; then
            python3 scripts/classify-verification \
              --all --head "$head_sha" --github-output "$GITHUB_OUTPUT"
          else
            if ! python3 scripts/classify-verification \
              --base "$base_sha" --head "$head_sha" --github-output "$GITHUB_OUTPUT"; then
              echo "Event base is unusable; selecting all verification gates" >&2
              python3 scripts/classify-verification \
                --all --head "$head_sha" --github-output "$GITHUB_OUTPUT"
            fi
          fi

      - name: Development workflow self-test
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true'
        run: python3 scripts/test-development-preflight

      - name: Run documentation and static checks
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.docs_only == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          HEAD_SHA: ${{ steps.scope.outputs.head }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA" -- .
          while IFS= read -r path; do
            if [[ ! -f "$path" ]]; then
              continue
            fi
            case "$path" in
              *.md)
                fences="$(awk '/^```/ { count++ } END { print count + 0 }' "$path")"
                if (( fences % 2 != 0 )); then
                  echo "Unbalanced Markdown fences: $path" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

      - name: Resolve the hosted Align compiler bundle
        id: align-bundle
        if: (steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          python3 scripts/ci-align-bundle key \
            --directory "$RUNNER_TEMP/align-llm-hosted-bundle" \
            --align-revision "$revision" \
            --image-version "$ImageVersion" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-version "$RUST_VERSION" \
            --llvm-major 22 >> "$GITHUB_OUTPUT"

      - name: Restore the hosted Align compiler bundle
        id: align-bundle-cache
        if: (steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.align-bundle.outputs.path }}
          key: ${{ steps.align-bundle.outputs.key }}

      - name: Verify the hosted Align compiler bundle
        if: steps.align-bundle-cache.outputs.cache-hit == 'true'
        shell: bash
        env:
          BUNDLE_DIRECTORY: ${{ steps.align-bundle.outputs.path }}
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          python3 scripts/ci-align-bundle verify \
            --directory "$BUNDLE_DIRECTORY" \
            --align-revision "$revision" \
            --image-version "$ImageVersion" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-version "$RUST_VERSION" \
            --llvm-major 22
          echo "ALIGNC=$BUNDLE_DIRECTORY/alignc" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BUNDLE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Resolve the apt package cache entry
        id: apt-llvm
        if: ((steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.align-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-apt-llvm.sh key >> "$GITHUB_OUTPUT"

      - name: Restore the apt package cache
        id: apt-llvm-cache
        if: ((steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.align-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}

      - name: Install LLVM and native libraries
        if: ((steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.align-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          scripts/ci-apt-llvm.sh install
          dpkg-query --show llvm-22-dev

      - name: Install Rust
        if: ((steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.align-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Check out pinned Align revision
        if: (steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          mkdir align
          git -C align init
          git -C align remote add origin https://github.com/sanohiro/align.git
          git -C align fetch --depth 1 origin "$revision"
          git -C align checkout --detach FETCH_HEAD

      - name: Build the pinned Align compiler
        if: ((steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.align-bundle-cache.outputs.cache-hit != 'true'
        env:
          ALIGN_REPO: ${{ github.workspace }}/align
          LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
          LLVM_CONFIG: /usr/lib/llvm-22/bin/llvm-config
        run: |
          export PATH="/usr/lib/llvm-22/bin:$PATH"
          make align-build
          test -x "$ALIGN_REPO/target/release/alignc"

      - name: Create the hosted Align compiler bundle
        id: align-bundle-create
        if: ((steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main')) && steps.align-bundle-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          ALIGN_REPO: ${{ github.workspace }}/align
          BUNDLE_DIRECTORY: ${{ steps.align-bundle.outputs.path }}
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          python3 scripts/ci-align-bundle create \
            --directory "$BUNDLE_DIRECTORY" \
            --align-revision "$revision" \
            --image-version "$ImageVersion" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-version "$RUST_VERSION" \
            --llvm-major 22 \
            --align-repo "$ALIGN_REPO" \
            --llvm-library /lib/x86_64-linux-gnu/libLLVM.so.22.1
          echo "ALIGNC=$BUNDLE_DIRECTORY/alignc" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BUNDLE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Run supported project checks
        id: supported-checks
        if: (steps.reuse.outputs.reused != 'true' && steps.scope.outputs.hosted == 'true') || (steps.reuse.outputs.reused == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.align-bundle-cache.outputs.cache-hit != 'true')
        env:
          ALIGN_LLM_OUTPUT_DIRECTORY: ${{ runner.temp }}/align-llm-output
          ALIGN_REPO: ${{ github.workspace }}/align
        run: |
          # coding-v1 requires nested user namespaces, which GitHub-hosted runners deny.
          # Keep that gate in make ci for local or capable self-hosted runners.
          # baseline-check remains in the capable gate with coding-v1.
          test -x "$ALIGNC"
          python3 scripts/check-gate-topology --self-test
          python3 scripts/run-output-summary --phase hosted-checks -- \
            make -j8 ALIGNC="$ALIGNC" hosted-checks

      - name: Retain supported-check logs
        if: always() && steps.supported-checks.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/align-llm-output
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: false

      - name: Reverify the apt package cache candidate
        id: apt-llvm-candidate
        if: steps.apt-llvm-cache.outcome == 'success' && steps.supported-checks.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.apt-llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/ci-apt-llvm.sh verify

      - name: Save the apt package cache
        id: apt-llvm-save
        if: steps.apt-llvm-candidate.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}

      - name: Confirm the published apt package cache
        id: apt-llvm-confirm
        if: steps.apt-llvm-save.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.apt-llvm.outputs.path }}
          key: ${{ steps.apt-llvm.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Require the published apt package cache
        if: always() && steps.apt-llvm-save.outcome == 'success'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.apt-llvm-confirm.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != "true" ]]; then
            echo "The exact apt package cache is not branch-visible after publication." >&2
            exit 1
          fi

      - name: Reverify the hosted Align compiler bundle candidate
        id: align-bundle-candidate
        if: steps.align-bundle-create.outcome == 'success' && steps.supported-checks.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          BUNDLE_DIRECTORY: ${{ steps.align-bundle.outputs.path }}
        run: |
          revision="$(tr -d '[:space:]' < .align-revision)"
          python3 scripts/ci-align-bundle verify \
            --directory "$BUNDLE_DIRECTORY" \
            --align-revision "$revision" \
            --image-version "$ImageVersion" \
            --runner-os "$RUNNER_OS" \
            --runner-arch "$RUNNER_ARCH" \
            --rust-version "$RUST_VERSION" \
            --llvm-major 22

      - name: Save the hosted Align compiler bundle
        id: align-bundle-save
        if: steps.align-bundle-candidate.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.align-bundle.outputs.path }}
          key: ${{ steps.align-bundle.outputs.key }}

      - name: Confirm the published hosted Align compiler bundle
        id: align-bundle-confirm
        if: steps.align-bundle-save.outcome == 'success'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.align-bundle.outputs.path }}
          key: ${{ steps.align-bundle.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Require the published hosted Align compiler bundle
        if: always() && steps.align-bundle-save.outcome == 'success'
        shell: bash
        env:
          CACHE_HIT: ${{ steps.align-bundle-confirm.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" != "true" ]]; then
            echo "The exact hosted Align compiler bundle is not branch-visible after publication." >&2
            exit 1
          fi

      - name: Bind pull request evidence pr=${{ github.event.pull_request.number }} base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }}
        if: always() && github.event_name == 'pull_request'
        run: echo "This successful step binds the job record to the pull request event identities."

  fresh-image-profile:
    name: Installed Ubuntu 24.04 fresh-image profile (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reuse exact merged pull request checks
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/select-ci-reuse
          --event-name "$GITHUB_EVENT_NAME"
          --event-path "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --api-url "$GITHUB_API_URL"
          --github-output "$GITHUB_OUTPUT"

      - name: Report reused pull request checks
        if: steps.reuse.outputs.reused == 'true'
        env:
          SOURCE_HEAD: ${{ steps.reuse.outputs.source_head }}
          PULL_REQUEST: ${{ steps.reuse.outputs.pull_request }}
          WORKFLOW_RUN: ${{ steps.reuse.outputs.workflow_run }}
        run: >-
          echo "Reused pull request #$PULL_REQUEST workflow run $WORKFLOW_RUN
          for exact head $SOURCE_HEAD."

      - name: Classify verification scope
        id: scope
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$BASE_SHA"
          head_sha="$HEAD_SHA"
          select_all=false
          case "$EVENT_NAME" in
            pull_request)
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              head_sha="$PUSH_HEAD_SHA"
              ;;
            *)
              head_sha="$GITHUB_SHA"
              select_all=true
              ;;
          esac
          if [[ -z "$head_sha" || "$head_sha" =~ ^0+$ ]]; then
            echo "Cannot resolve the event head" >&2
            exit 1
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            select_all=true
          fi
          if [[ "$select_all" == "true" ]]; then
            python3 scripts/classify-verification \
              --all --head "$head_sha" --github-output "$GITHUB_OUTPUT"
          else
            if ! python3 scripts/classify-verification \
              --base "$base_sha" --head "$head_sha" --github-output "$GITHUB_OUTPUT"; then
              echo "Event base is unusable; selecting all verification gates" >&2
              python3 scripts/classify-verification \
                --all --head "$head_sha" --github-output "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run deterministic control-plane checks
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_focused == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/run-fresh-worker-qualification

      - name: Set up Docker Buildx
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare installed image signing material
        id: image_material
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 scripts/prepare-fresh-image-build
          --directory "$RUNNER_TEMP/align-llm-fresh-image-material"
          --github-output "$GITHUB_OUTPUT"

      - name: Build installed image with shared layers
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: image/fresh/Dockerfile
          pull: true
          load: true
          tags: ${{ steps.image_material.outputs.image }}
          build-args: |
            IMAGE_PUBLIC_KEY_HEX=${{ steps.image_material.outputs.image_public_key_hex }}
            RUN_PUBLIC_KEY_HEX=${{ steps.image_material.outputs.run_public_key_hex }}
          cache-from: type=gha,scope=align-llm-fresh-image-v1-${{ matrix.architecture }}
          cache-to: type=gha,scope=align-llm-fresh-image-v1-${{ matrix.architecture }},mode=max,ignore-error=true

      - name: Restore pinned Align source
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: align-source
          key: align-full-source-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('.align-revision') }}

      - name: Materialize pinned Align source
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < .align-revision)"
          if [[ ! -d align-source/.git ]]; then
            mkdir align-source
            git -C align-source init
            git -C align-source remote add origin https://github.com/sanohiro/align.git
            git -C align-source fetch origin "$revision"
            git -C align-source checkout --detach FETCH_HEAD
          fi
          test "$(git -C align-source rev-parse HEAD)" = "$revision"
          test ! -e align-source/.git/shallow
          if git -C align-source config --get-regexp \
            '^(extensions\.partialclone|remote\..*\.promisor)$'; then
            echo "Pinned Align cache must not be a partial clone" >&2
            exit 1
          fi
          git -C align-source fsck --connectivity-only --no-dangling
          test -z "$(git -C align-source status --porcelain --untracked-files=all)"

      - name: Enable qualified nested user namespaces
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        id: userns
        shell: bash
        run: |
          set -euo pipefail
          setting=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          changed=false
          previous=0
          if [[ -e "$setting" ]]; then
            previous="$(<"$setting")"
            if [[ ! "$previous" =~ ^[01]$ ]]; then
              echo "Unexpected AppArmor user-namespace setting: $previous" >&2
              exit 1
            fi
            if [[ "$previous" != "0" ]]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
              changed=true
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          unshare --user --map-root-user true

      - name: Complete installed image profile qualification
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PREPARED_IMAGE: ${{ steps.image_material.outputs.image }}
          IMAGE_SIGNING_SEED: ${{ steps.image_material.outputs.material_directory }}/image-signing-seed
          RUN_SIGNING_SEED: ${{ steps.image_material.outputs.material_directory }}/run-signing-seed
        run: >-
          env -u DOCKER_HOST python3 scripts/run-fresh-worker-qualification
          --installed-profile-only --require-docker
          --align-repo "$GITHUB_WORKSPACE/align-source"
          --prepared-image "$PREPARED_IMAGE"
          --image-signing-seed "$IMAGE_SIGNING_SEED"
          --run-signing-seed "$RUN_SIGNING_SEED"

      - name: Restore user namespace restriction
        if: always() && steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed == 'true' && steps.userns.outputs.changed == 'true'
        shell: bash
        env:
          PREVIOUS_USERNS_RESTRICTION: ${{ steps.userns.outputs.previous }}
        run: |
          set -euo pipefail
          if [[ ! "$PREVIOUS_USERNS_RESTRICTION" =~ ^[01]$ ]]; then
            echo "Refusing invalid AppArmor user-namespace restore value" >&2
            exit 1
          fi
          sudo sysctl -w \
            "kernel.apparmor_restrict_unprivileged_userns=$PREVIOUS_USERNS_RESTRICTION"

      - name: Clean installed image signing material
        if: always() && steps.image_material.outcome == 'success'
        env:
          PREPARED_IMAGE: ${{ steps.image_material.outputs.image }}
          MATERIAL_DIRECTORY: ${{ steps.image_material.outputs.material_directory }}
        run: |
          set -euo pipefail
          env -u DOCKER_HOST docker image rm -f "$PREPARED_IMAGE" >/dev/null 2>&1 || true
          python3 scripts/prepare-fresh-image-build \
            --cleanup --directory "$MATERIAL_DIRECTORY"

      - name: Report unaffected image profile
        if: steps.reuse.outputs.reused != 'true' && steps.scope.outputs.fresh_installed != 'true'
        run: echo "FRESH-IMAGE owners are unchanged; focused profile qualification is N/A."

      - name: Bind pull request evidence pr=${{ github.event.pull_request.number }} base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }}
        if: always() && github.event_name == 'pull_request'
        run: echo "This successful step binds the job record to the pull request event identities."
